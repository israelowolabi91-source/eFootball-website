services:
  - type: web
    name: tim-efootball-league
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: efootball-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_REVIEW_TOKEN
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

